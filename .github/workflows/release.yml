name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g., v1.0.0)'
        required: true
        type: string

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests
          npm install
      
      - name: Run tests
        run: |
          python3 comprehensive_api_tests.py || true
          python3 sdk_package_tests.py || true
      
      - name: Generate release report
        run: python3 generate_report.py || true
      
      - name: Create release archive
        run: |
          mkdir -p release
          cp -r reports release/
          cp -r test_framework release/
          cp comprehensive_api_tests.py release/
          cp sdk_package_tests.py release/
          cp generate_report.py release/
          cp README.md release/
          cp package.json release/
          tar -czvf apisyn-release.tar.gz release/
          zip -r apisyn-release.zip release/
      
      - name: Get version
        id: version
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "version=${{ inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "version=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          fi
      
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: Release ${{ steps.version.outputs.version }}
          body: |
            ## API Integration Test Suite Release
            
            ### Included Packages
            - Shopify Partner API tests
            - Shopify Admin API tests
            - Shopify Storefront API tests
            - Zone Chan App tests
            - MCP Server integration tests
            - SDK package validation tests
            
            ### Test Results
            See the attached reports for detailed test results.
          files: |
            apisyn-release.tar.gz
            apisyn-release.zip
            reports/integration_test_report.md
            reports/test_summary.json
          draft: false
          prerelease: false
